[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-governance"
version = "0.1.0"
description = "Medallion lakehouse with enforced roles, column masking, and verifiable column-level lineage."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
lakehouse = "lakehouse_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
